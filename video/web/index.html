<!doctype html>
<html><head><meta charset="utf-8"><title>Pip &amp; Bloo's Rainbow Garden</title>
<style>
@font-face{font-family:Fredoka;src:url(fredoka.woff2) format("woff2");font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Fredoka,"Liberation Sans",sans-serif;font-weight:700}
#stage canvas{position:absolute;left:0;top:0}
.ov{position:absolute;left:0;width:1920px;text-align:center;pointer-events:none;white-space:nowrap;
  -webkit-text-stroke:16px #fff;paint-order:stroke fill;
  text-shadow:0 10px 0 rgba(255,255,255,.0),0 14px 30px rgba(40,40,120,.35)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,255,255,0) 62%,rgba(90,60,160,.20) 100%)}
#fade{position:absolute;inset:0;background:#fff;opacity:1;pointer-events:none}
#title1{top:150px;font-size:120px;color:#ff7bb0}
#title2{top:290px;font-size:210px}
#title2 span,#end1 span{display:inline-block}
#word{top:48px;font-size:230px;opacity:0}
#words{top:48px;font-size:130px;opacity:1}
#words span{display:inline-block;margin:0 26px;opacity:0}
#badge{position:absolute;right:90px;bottom:90px;width:250px;height:250px;border-radius:50%;
  background:#fff;border:14px solid #fff;box-shadow:0 12px 40px rgba(60,40,140,.35);
  display:flex;align-items:center;justify-content:center;font-size:190px;opacity:0;
  -webkit-text-stroke:0}
#end1{top:300px;font-size:190px}
#end2{top:560px;font-size:78px;color:#7b5cff;-webkit-text-stroke:12px #fff}
</style></head>
<body><div id="stage">
<div id="vig"></div>
<div class="ov" id="title1">Pip &amp; Bloo's</div>
<div class="ov" id="title2"></div>
<div class="ov" id="word"></div>
<div class="ov" id="words"><span style="color:#ff4d5e">RED</span><span style="color:#ffb800">YELLOW</span><span style="color:#2f9bff">BLUE</span><span style="color:#2fbf4a">GREEN</span></div>
<div id="badge"></div>
<div class="ov" id="end1"></div>
<div class="ov" id="end2">See you next time!</div>
<div id="fade"></div>
</div>
<script src="timeline.js"></script>
<script type="module" src="scene.js"></script>
</body></html>
